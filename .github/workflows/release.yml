name: Release

# ⚠️  The FILENAME of this workflow is load-bearing.
#
# npm matches the trusted publisher's "workflow filename" field against the
# OIDC token's job_workflow_ref claim. Renaming this file without updating the
# trusted-publisher config for every published package makes releases fall back
# to an untrusted publish *silently* — pnpm logs "Skipped OIDC" and carries on.
# Configured on npm as: release.yml
#
# This is the only workflow allowed to publish.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Zig
        uses: actions/cache@v3
        id: cache-zig
        with:
          path: ~/.zig
          key: ${{ runner.os }}-zig-0.17.0-dev.1503+1f1bee62e

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        if: steps.cache-zig.outputs.cache-hit != 'true'
        with:
          version: 0.17.0-dev.1503+1f1bee62e
        
      - name: Cache wasm-opt
        uses: actions/cache@v3
        id: cache-wasm-opt
        with:
          path: ~/.local/bin/wasm-opt
          key: ${{ runner.os }}-wasm-opt-123

      - name: Install wasm-opt version 123
        if: steps.cache-wasm-opt.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          # Download binaryen version 123
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz -o binaryen.tar.gz
          
          # Extract the tar file
          tar -xzf binaryen.tar.gz
          
          # Move wasm-opt to the cached location
          cp binaryen-version_123/bin/wasm-opt ~/.local/bin/wasm-opt
          chmod +x ~/.local/bin/wasm-opt
          
          # Clean up
          rm -rf binaryen.tar.gz binaryen-version_123

      - name: Add wasm-opt to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify wasm-opt
        run: wasm-opt --version

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          # must stay >= 11: the entire 10.x line lacks OIDC support, and
          # `changeset publish` resolves its publish tool from packageManager
          version: 11.15.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run checks
        run: pnpm test

      - name: Verify a packaged install still renders
        run: pnpm check:clean-room

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # publishes through a guard that fails the release if pnpm reports
          # "Skipped OIDC" — a warning it would otherwise publish straight past
          publish: node .github/scripts/publish-with-oidc-guard.mjs
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify the release was actually trusted
        if: steps.changesets.outputs.published == 'true'
        run: node .github/scripts/verify-release-trust.mjs
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}